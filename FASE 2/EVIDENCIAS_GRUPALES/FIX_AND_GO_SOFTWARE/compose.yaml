# Entorno de demostración local; no es un despliegue de producción.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env.docker}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      PAYMENTS_DEMO_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:18090,http://127.0.0.1:18090
      SQLITE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - fixgo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
  mobile:
    build: ./mobile
    ports:
      - "127.0.0.1:18090:8090"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:18000
    depends_on:
      backend:
        condition: service_healthy
volumes:
  fixgo_data:
